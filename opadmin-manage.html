<!DOCTYPE html>
<html lang="bn" translate="no">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="preconnect" href="https://firestore.googleapis.com" crossorigin><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="cloud.js?v=1"></script>
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অ্যাডমিন · আপনার মন্তব্য</title>
<meta name="theme-color" content="#6b3fa0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var m=localStorage.getItem("div29-mode")||"auto";document.documentElement.setAttribute("data-mode",m=="auto"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):m)}catch(e){document.documentElement.setAttribute("data-mode","light")}</script>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#121826;--mu:#667085;--ln:#e3e7ef;--ac:#6b3fa0;--ok:#12b76a;--bad:#b42318;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode=dark]{--bg:#0a0f1f;--card:#131a2e;--tx:#e8ecf6;--mu:#98a2b8;--ln:#232c45;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Nirmala UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{background:linear-gradient(160deg,var(--ac),#0d1b6b);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 40px;margin:0 -14px;border-radius:0 0 28px 28px}
.bar{display:flex;align-items:center;gap:8px}.bar .sp{flex:1}
.ib{background:rgba(255,255,255,.16);border:0;color:#fff;height:38px;min-width:38px;padding:0 12px;border-radius:99px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
header h1{margin:14px 0 0;font-size:22px;font-weight:800}
header small{display:block;font-size:12px;opacity:.85;margin-top:4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 18px rgba(13,27,107,.08)}
.card:first-of-type{margin-top:-22px}
h2{font-size:13px;color:var(--mu);letter-spacing:.06em;margin:22px 4px 0;font-weight:800}
label{display:block;font-size:13px;font-weight:700;color:var(--mu);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:11px;outline:none}
textarea{height:96px;resize:none}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.btn{width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px;background:var(--ac);color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.sm{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.sm.red{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{min-height:20px;margin-top:10px;font-size:14px;font-weight:700;text-align:center}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac);margin-right:6px}
.st{font-size:12px;font-weight:800}.st.on{color:#067647}.st.off{color:var(--bad)}
.poll h3{margin:8px 0 4px;font-size:17px;line-height:1.35}
.meta{font-size:13px;color:var(--mu);line-height:1.6}
.br{margin-top:9px}.br .t{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:3px}.br .t span:last-child{font-weight:800;white-space:nowrap}
.tr{height:11px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--ln)}.fl{height:100%;background:var(--ac);border-radius:99px}
.cm{border-top:1px dashed var(--ln);padding:9px 0;font-size:14px;line-height:1.5;white-space:pre-wrap}
.empty{text-align:center;color:var(--mu);padding:24px 8px}
.foot{text-align:center;margin-top:24px;font-size:13px;color:var(--mu);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="bar"><a class="ib" href="op-menu.html">‹ মেনু</a><span class="sp"></span><a class="ib" href="#" onclick="smLock();return false">🔒</a></div>
 <h1>অ্যাডমিন প্যানেল</h1><small>আপনার মন্তব্য · দরবার পয়েন্ট ব্যবস্থাপনা</small>
</header>

<section class="card">
 <b>নতুন দরবার পয়েন্ট</b>
 <label>কোন দরবার?</label>
 <select id="sec"><option value="goc">জিওসি দরবার পয়েন্ট</option><option value="cmd">কমান্ডার দরবার পয়েন্ট</option><option value="adh">অধিনায়কের দরবার পয়েন্ট</option></select>
 <label>বিষয় / প্রশ্ন</label>
 <input id="ttl" maxlength="200" placeholder="যেমন: রেশনের মান নিয়ে আপনার মত কী?">
 <label>বিস্তারিত (ঐচ্ছিক)</label>
 <textarea id="dsc" maxlength="600" style="height:70px"></textarea>
 <label>অপশনসমূহ (প্রতি লাইনে একটি, ২ থেকে ৮টি)</label>
 <textarea id="opt" placeholder="খুব ভালো&#10;ভালো&#10;মোটামুটি&#10;খারাপ"></textarea>
 <div class="row2"><div><label>দরবারের তারিখ</label><input type="date" id="dd"></div><div><label>ভোট চলবে (শেষ তারিখ)</label><input type="date" id="ve"></div></div>
 <div style="font-size:12.5px;color:var(--mu);margin-top:6px">ভোট শেষ তারিখ ফাঁকা রাখলে দরবারের তারিখ পর্যন্ত চলবে। শেষ তারিখের রাত ১১:৫৯ (বাংলাদেশ সময়) পর্যন্ত ভোট নেওয়া হবে।</div>
 <button class="btn" id="add">প্রকাশ করুন</button>
 <div class="msg" id="am"></div>
</section>

<h2>সব দরবার পয়েন্ট ও ফলাফল</h2>
<div id="list"><div class="empty">লোড হচ্ছে…</div></div>
<div class="foot">Create By Ocu Emon</div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function bn(n){return String(n).replace(/\d/g,function(d){return"০১২৩৪৫৬৭৮৯".charAt(d)})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var SEC={goc:"জিওসি দরবার",cmd:"কমান্ডার দরবার",adh:"অধিনায়কের দরবার"};
var MN=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
function fd(s){var a=String(s).split("-");return bn(+a[2])+" "+MN[a[1]-1]+" "+bn(a[0])}
var db=null,polls=[];
function isOpen(p){return p.open!==false&&p.endAt&&Date.now()<p.endAt.toMillis()}

function load(){
  $("list").innerHTML='<div class="empty">লোড হচ্ছে…</div>';
  db.collection("polls").get().then(function(sn){
    polls=sn.docs.map(function(d){var o=d.data();o.id=d.id;return o});
    polls.sort(function(a,b){return String(b.darbarDate).localeCompare(String(a.darbarDate))});
    return Promise.all(polls.map(function(p){return db.collection("votes").where("p","==",p.id).get().then(function(v){var c=p.options.map(function(){return 0});v.forEach(function(d){var o=d.data().o;if(c[o]!=null)c[o]++});p.cnt=c})}));
  }).then(render).catch(function(e){$("list").innerHTML='<div class="empty">লোড করা যায়নি'+(e&&e.code=="permission-denied"?" (অনুমতি নেই — Rules দেখুন)":"")+'</div>'});
}
function render(){
  if(!polls.length){$("list").innerHTML='<div class="empty">এখনো কোনো দরবার পয়েন্ট নেই।</div>';return}
  $("list").innerHTML=polls.map(function(p){
    var t=p.cnt.reduce(function(a,b){return a+b},0),open=isOpen(p);
    return'<section class="card poll" id="p-'+p.id+'"><span class="tag">'+SEC[p.section]+'</span><span class="st '+(open?"on":"off")+'">'+(open?"● চলছে":"বন্ধ")+'</span><h3>'+esc(p.title)+'</h3>'
     +'<div class="meta">🗓 দরবার: '+fd(p.darbarDate)+' · ⏳ ভোট: '+fd(p.voteEnd||p.darbarDate)+' পর্যন্ত</div>'
     +p.options.map(function(o,i){var pc=t?Math.round(p.cnt[i]*100/t):0;return'<div class="br"><div class="t"><span>'+esc(o)+'</span><span>'+bn(p.cnt[i])+' · '+bn(pc)+'%</span></div><div class="tr"><div class="fl" style="width:'+pc+'%"></div></div></div>'}).join("")
     +'<div class="meta" style="margin-top:10px">মোট ভোট: <b>'+bn(t)+'</b></div>'
     +'<div class="acts"><button class="sm" data-a="tg" data-id="'+p.id+'">'+(p.open===false?"ভোট চালু করুন":"ভোট বন্ধ করুন")+'</button><button class="sm" data-a="cm" data-id="'+p.id+'">মন্তব্য দেখুন</button><button class="sm red" data-a="rm" data-id="'+p.id+'">মুছুন</button></div><div id="c-'+p.id+'"></div></section>';
  }).join("");
}
function find(id){return polls.filter(function(p){return p.id==id})[0]}
$("list").addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var id=b.getAttribute("data-id"),a=b.getAttribute("data-a"),p=find(id);if(!p)return;
  if(a=="tg"){db.collection("polls").doc(id).update({open:p.open===false}).then(load).catch(function(){alert("বদলানো যায়নি")})}
  if(a=="cm"){
    var box=$("c-"+id);box.innerHTML='<div class="empty">লোড হচ্ছে…</div>';
    db.collection("comments").where("p","==",id).get().then(function(sn){
      var arr=[];sn.forEach(function(d){arr.push(d.data().c)});
      box.innerHTML=arr.length?'<div style="margin-top:12px;font-weight:800;font-size:13px;color:var(--mu)">অজ্ঞাত মন্তব্য ('+bn(arr.length)+')</div>'+arr.map(function(c){return'<div class="cm">'+esc(c)+'</div>'}).join(""):'<div class="empty">কোনো মন্তব্য নেই</div>';
    }).catch(function(){box.innerHTML='<div class="empty">মন্তব্য পড়া যায়নি</div>'});
  }
  if(a=="rm"){
    if(!confirm("এই দরবার পয়েন্ট ও এর সব ভোট ও মন্তব্য স্থায়ীভাবে মুছে যাবে। নিশ্চিত?"))return;
    Promise.all([db.collection("votes").where("p","==",id).get(),db.collection("comments").where("p","==",id).get()]).then(function(r){
      var refs=[];r[0].forEach(function(d){refs.push(d.ref)});r[1].forEach(function(d){refs.push(d.ref)});
      var chunks=[];for(var i=0;i<refs.length;i+=400)chunks.push(refs.slice(i,i+400));
      return Promise.all(chunks.map(function(c){var bt=db.batch();c.forEach(function(x){bt.delete(x)});return bt.commit()}));
    }).then(function(){return db.collection("polls").doc(id).delete()}).then(load).catch(function(){alert("মোছা যায়নি")});
  }
});
$("add").onclick=function(){
  var m=$("am"),ttl=$("ttl").value.trim(),opts=$("opt").value.split("\n").map(function(s){return s.trim()}).filter(Boolean),dd=$("dd").value,ve=$("ve").value||dd;
  function er(t){m.style.color="var(--bad)";m.textContent=t}
  var uniq=opts.filter(function(o,i){return opts.indexOf(o)==i});
  if(!ttl)return er("বিষয় / প্রশ্ন লিখুন");
  if(uniq.length<2||uniq.length>8)return er("২ থেকে ৮টি আলাদা অপশন দিন");
  if(!dd)return er("দরবারের তারিখ দিন");
  if(ve>dd&&!confirm("ভোটের শেষ তারিখ দরবারের পরে। ঠিক আছে?"))return;
  var end=new Date(ve+"T23:59:59+06:00");if(isNaN(end.getTime()))return er("তারিখ ঠিক নেই");
  $("add").disabled=true;m.style.color="var(--mu)";m.textContent="প্রকাশ হচ্ছে…";
  db.collection("polls").doc().set({section:$("sec").value,title:ttl,desc:$("dsc").value.trim(),options:uniq,darbarDate:dd,voteEnd:ve,endAt:firebase.firestore.Timestamp.fromDate(end),open:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){
    $("add").disabled=false;m.style.color="var(--ok)";m.textContent="✓ প্রকাশ হয়েছে";$("ttl").value="";$("dsc").value="";$("opt").value="";load();
  }).catch(function(e){$("add").disabled=false;er(e&&e.code=="permission-denied"?"অনুমতি নেই (অ্যাডমিন লগইন/Rules দেখুন)":"প্রকাশ করা যায়নি")});
};
window.div29Ready.then(function(x){db=x.db;load()});
</script>
</body>
</html>
