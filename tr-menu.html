<!DOCTYPE html>
<html lang="bn" translate="no">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="preconnect" href="https://firestore.googleapis.com" crossorigin><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="cloud.js?v=1"></script>
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ট্রুপস / সেকশন</title>
<meta name="theme-color" content="#c25a00">
<meta name="apple-mobile-web-app-title" content="29 Div locating Battery Artillery">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var m=localStorage.getItem("div29-mode")||"auto";document.documentElement.setAttribute("data-mode",m=="auto"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):m)}catch(e){document.documentElement.setAttribute("data-mode","light")}</script>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#121826;--mu:#667085;--ln:#e3e7ef;--ac:#c25a00;--gold:#f2c200;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode=dark]{--bg:#0a0f1f;--card:#131a2e;--tx:#e8ecf6;--mu:#98a2b8;--ln:#232c45;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Nirmala UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 40px}
header{background:linear-gradient(160deg,var(--ac),#0d1b6b);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 66px;margin:0 -14px;border-radius:0 0 28px 28px}
.bar{display:flex;align-items:center;gap:8px}
.bar .sp{flex:1}
.ib{background:rgba(255,255,255,.16);border:0;color:#fff;height:38px;min-width:38px;padding:0 12px;border-radius:99px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.hero{display:flex;align-items:center;gap:14px;margin-top:18px}
.hero img{width:66px;height:66px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 3px var(--gold),0 6px 18px rgba(0,0,0,.25);flex:none}
.hero h1{margin:0;font-size:24px;line-height:1.2;font-weight:800}
.hero small{display:block;font-size:12px;opacity:.85;margin-top:4px;font-weight:600}
.list{margin-top:-38px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;text-decoration:none;color:var(--tx);box-shadow:0 4px 18px rgba(13,27,107,.08);font-size:17px;font-weight:700}
.row:active,.tile:active{transform:scale(.98)}
.row small{display:block;font-size:12.5px;color:var(--mu);font-weight:600;margin-top:2px}
.ic{width:50px;height:50px;border-radius:15px;background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ic svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ar{margin-left:auto;color:var(--mu);font-size:22px;font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;text-decoration:none;color:var(--tx);box-shadow:0 4px 18px rgba(13,27,107,.08);min-height:122px;justify-content:center}
.tile b{font-size:18px}
.tile small{font-size:12.5px;color:var(--mu);font-weight:600;margin-top:-6px}
h2{font-size:13px;color:var(--mu);letter-spacing:.06em;margin:24px 4px 10px;font-weight:800}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px}
#sw{display:flex;gap:14px;justify-content:center}
#sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer}
#sw button.on{border-color:var(--tx)}
.rep{text-align:center;margin-bottom:12px}
.rep b{display:block;font-size:19px}
.rep span{display:block;margin-top:4px;color:var(--mu);font-size:13px}
.sheet{overflow-x:auto;border:1px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 8px;border:1px solid var(--mu);text-align:center}
th{font-size:14px;font-weight:800}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.tot td{font-weight:800}
td.x,th.x{border:0;width:36px;padding:0}
td.x button{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer;padding:8px}
.empty{padding:18px;text-align:center;color:var(--mu)}
.add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.add input{flex:1 1 110px;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;font-size:15px;outline:none}
.add button{padding:12px 20px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.foot{text-align:center;margin-top:24px;font-size:13px;color:var(--mu);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="bar"><a class="ib" id="bk" href="index.html">‹ হোম</a><span class="sp"></span><button class="ib" id="th" aria-label="থিম"></button><a class="ib" href="#" onclick="smLock();return false">🔒</a></div>
 <div class="hero"><img src="icon-192.png" alt=""><div><h1 id="ttl">ট্রুপস / সেকশন</h1><small id="sb">29 Div locating Battery Artillery</small></div></div>
</header>
<div class="list" id="view"></div>
<div id="pal"></div>
<div class="foot">Create By Ocu Emon</div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function bn(n){return String(n).replace(/\d/g,function(d){return"০১২৩৪৫৬৭৮৯".charAt(d)})}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function svg(p){return'<svg viewBox="0 0 24 24">'+p+'</svg>'}

var SUBS=[
 {id:"survey",n:"সার্ভে",i:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>'},
 {id:"sr",n:"এসআর",i:'<path d="M12 21v-9"/><circle cx="12" cy="9" r="2"/><path d="M8 5.5a5.5 5.5 0 0 0 0 7M16 5.5a5.5 5.5 0 0 1 0 7"/>'},
 {id:"radar",n:"রাডার",i:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/>'},
 {id:"met",n:"মেট",i:'<path d="M7 18a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 8.5 4 4 0 0 1 17 18z"/>'},
 {id:"ocu",n:"ওসিইউ",i:'<path d="M5 5v14M12 5v14M19 5v14"/><circle cx="5" cy="9" r="2"/><circle cx="12" cy="15" r="2"/><circle cx="19" cy="8" r="2"/>'},
 {id:"mt",n:"এমটি",i:'<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>'}
];
var KINDS={
 leave:{n:"ছুটি",h:"ছুটির নামীয় তালিকা",cols:["C/L","P/L"],num:true,i:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'},
 team:{n:"দলগত",h:"দলগত নামীয় তালিকা",cols:["মন্তব্য"],i:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.6 3.5 2.6 3.5 6"/>'},
 camp:{n:"ক্যাম্প",h:"ক্যাম্প নামীয় তালিকা",cols:["মন্তব্য"],i:'<path d="M3 20L12 5l9 15zM12 5v15"/>'},
 games:{n:"গেমস/কম্পিটিশন",h:"গেমস/কম্পিটিশন নামীয় তালিকা",cols:["মন্তব্য"],i:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 13v4M9 20h6"/>'}
};
function key(id,k){return"tr-"+id+"-"+k}
function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cnt(id,k){
  var v=null;try{v=JSON.parse(localStorage.getItem(key(id,k)))}catch(e){}
  if(Array.isArray(v))return v.length;
  if(v&&v.t){var n=0;for(var t in v.t)n+=(v.t[t].rows||[]).length;return n}
  return 0}
function sub(id){return SUBS.filter(function(x){return x.id===id})[0]}

var view=$("view"),bk=$("bk"),ttl=$("ttl"),sb=$("sb");
function head(t,s,backHash){
  ttl.textContent=t;sb.textContent=s;document.title=t;
  if(backHash===null){bk.href="index.html";bk.textContent="‹ হোম";bk.onclick=null}
  else{bk.href="#"+backHash;bk.textContent="‹ পিছনে";bk.onclick=function(e){e.preventDefault();location.hash=backHash}}
  $("pal").innerHTML="";
}

function home(){
  head("ট্রুপস / সেকশন","সেকশন বাছাই করুন",null);
  view.className="list";
  view.innerHTML='<div class="grid">'+SUBS.map(function(s){
    var t=0;Object.keys(KINDS).forEach(function(k){t+=cnt(s.id,k)});
    return'<a class="tile" href="#'+s.id+'"><div class="ic">'+svg(s.i)+'</div><b>'+s.n+'</b><small>'+(t?bn(t)+" জন তালিকাভুক্ত":"তালিকা খালি")+'</small></a>'}).join("")+'</div>';
  $("pal").innerHTML='<h2>রঙ বেছে নিন</h2><div class="card" id="sw"></div>';drawSw();
}
function section(id){
  var s=sub(id);if(!s){location.hash="";return}
  head(s.n,"ট্রুপস / সেকশন","");
  view.className="list";
  view.innerHTML=Object.keys(KINDS).map(function(k){var c=cnt(id,k);
    return'<a class="row" href="tr-sheet.html?s='+id+'&k='+k+'"><div class="ic">'+svg(KINDS[k].i)+'</div><div>'+KINDS[k].n+'<small>'+(c?bn(c)+" জন":"তালিকা খালি")+'</small></div><span class="ar">›</span></a>'}).join("");
}
function sheet(id,k){location.replace("tr-sheet.html?s="+id+"&k="+k)}
function route(){
  var h=location.hash.replace("#","");
  if(!h)return home();
  var p=h.split("-");
  if(p[1])sheet(p[0],p[1]);else section(h);
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);

/* থিম রঙ ও ডার্ক মোড */
var KT="tr-theme",PAL=[["কমলা","#c25a00"],["সবুজ","#2f6b4f"],["নীল","#305496"],["বেগুনি","#6b3fa0"],["লাল","#b42318"],["ধূসর","#374151"]];
var TH=+ls(KT)||0;if(TH<0||TH>=PAL.length)TH=0;
var MD=ls("div29-mode")||"auto",MI={auto:"🌗",light:"☀️",dark:"🌙"};
function apply(){document.documentElement.style.setProperty("--ac",PAL[TH][1]);document.querySelector('meta[name="theme-color"]').content=PAL[TH][1];
 Array.prototype.forEach.call(document.querySelectorAll("#sw button"),function(b,i){b.className=i==TH?"on":""});
 document.documentElement.setAttribute("data-mode",MD=="auto"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):MD);$("th").textContent=MI[MD]}
function drawSw(){var sw=$("sw");if(!sw)return;PAL.forEach(function(p,i){var b=document.createElement("button");b.style.background=p[1];b.setAttribute("aria-label",p[0]);b.onclick=function(){TH=i;ls(KT,i);apply()};sw.appendChild(b)});apply()}
$("th").onclick=function(){MD=MD=="auto"?"light":MD=="light"?"dark":"auto";ls("div29-mode",MD);apply()};
apply();route();
</script>
</body>
</html>
