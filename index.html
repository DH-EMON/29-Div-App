<style>

@keyframes tkb{50%{opacity:.25}}

@media (max-width:360px){.tk-l{font-size:11px;padding:0 16px 0 9px}.tick{height:38px}}

<body>
<div class="wrap">
<header>
 <div class="top"><img src="icon-192.png" alt=""><h1>29 Div locating<br>Battery Artillery<small>PIONEER LOCATOR</small></h1><button class="ib" id="th" aria-label="থিম"></button></div>
 <div class="tick" id="tick" role="marquee" aria-label="প্রেরণামূলক স্লোগান"><span class="tk-l"><i></i>MOTIVATION</span><div class="tk-v"><div class="tk-t" id="tkt"></div></div></div>
 <div class="pills"><span class="pill"><i class="dot" id="od"></i><span id="ot">অনলাইন</span></span><span class="pill" id="bt" style="display:none"></span></div>

</div>
<script>
var $=function(i){return document.getElementById(i)};
function bn(n){return String(n).replace(/\d/g,function(d){return"০১২৩৪৫৬৭৮৯".charAt(d)})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var MD=ls("div29-mode")||"auto",MI={auto:"🌗",light:"☀️",dark:"🌙"};
function applyMode(){var r=MD=="auto"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):MD;document.documentElement.setAttribute("data-mode",r);$("th").textContent=MI[MD]}
$("th").onclick=function(){MD=MD=="auto"?"light":MD=="light"?"dark":"auto";ls("div29-mode",MD);applyMode()};applyMode();
var H24=ls("div29-24")=="1";
$("tm").onclick=function(){H24=!H24;ls("div29-24",H24?"1":"0");tick()};
function p2(n){return(n<10?"0":"")+n}
function tick(){var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),ap="",hh=h,y=d.getFullYear();
if(!H24){ap=h<12?"AM":"PM";hh=h%12||12}
$("tm").innerHTML=bn(p2(hh)+":"+p2(m)+":"+p2(s))+"<small>"+(ap||"ঘণ্টা")+"</small>";
$("gr").textContent=h<5?"শুভ রাত্রি":h<12?"সুপ্রভাত":h<15?"শুভ দুপুর":h<18?"শুভ অপরাহ্ন":h<20?"শুভ সন্ধ্যা":"শুভ রাত্রি";
$("dt").textContent=d.toLocaleDateString("bn-BD",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
var doy=Math.round((new Date(y,d.getMonth(),d.getDate())-new Date(y,0,0))/864e5),len=((y%4==0&&y%100!=0)||y%400==0)?366:365;
$("dy").textContent="বছরের "+bn(doy)+" তম দিন · সপ্তাহ "+bn(Math.ceil(doy/7))+" · বছর বাকি "+bn(len-doy)+" দিন"}
tick();setInterval(tick,1000);
function net(){var o=navigator.onLine;$("od").style.background=o?"#12b76a":"#f79009";$("ot").textContent=o?"অনলাইন":"অফলাইন"}
addEventListener("online",net);addEventListener("offline",net);net();
if(navigator.getBattery)navigator.getBattery().then(function(b){function u(){$("bt").style.display="inline-flex";$("bt").textContent=(b.charging?"⚡ ":"🔋 ")+bn(Math.round(b.level*100))+"%"}u();b.onlevelchange=u;b.onchargingchange=u}).catch(function(){});
var APPS=[
{k:"sm",n:"সৈনিক মেস",s:"ফ্রেশ, রেশন, খরচ ও জনবল হিসাব",u:"sm-menu.html",c:"#2f6b4f",i:'<path d="M5 3v7a2 2 0 0 0 2 2v9M9 3v7M13 3v7a2 2 0 0 1-2 2M18 3c-2 1-3 4-3 8h3v10"/>'},
{k:"jco",n:"জেসিও মেস",s:"মেস হিসাব",u:"jco-menu.html",c:"#0f5f73",i:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>'},
{k:"jq",n:"JQ STORE",s:"মসলা, শুকনা রসদ, রেশন হিসাব",u:"jq-menu.html",c:"#305496",i:'<path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16M10 20v-5h4v5"/>'},
{k:"op",n:"আপনার মন্তব্য",s:"দরবার পয়েন্ট · গোপন ভোটিং ও মতামত",u:"op-menu.html",c:"#6b3fa0",i:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 14h5"/>'},
{k:"tr",n:"ট্রুপস / সেকশন",s:"সার্ভে, এসআর, রাডার, মেট, ওসিইউ, এমটি",u:"tr-menu.html",c:"#c25a00",i:'<path d="M4 17a8 8 0 0 1 16 0z"/><path d="M3 20h18M12 9V6"/>'}];
function ago(t){var m=Math.floor((Date.now()-t)/6e4);return m<1?"এইমাত্র":m<60?bn(m)+" মিনিট আগে":m<1440?bn(Math.floor(m/60))+" ঘণ্টা আগে":bn(Math.floor(m/1440))+" দিন আগে"}
var LA={};try{LA=JSON.parse(ls("div29-last"))||{}}catch(e){}
function mark(k){LA[k]=Date.now();ls("div29-last",JSON.stringify(LA))}
$("apps").innerHTML=APPS.map(function(a){return'<a class="card app" href="'+a.u+'" data-k="'+a.k+'"><div class="ic" style="background:'+a.c+'"><svg viewBox="0 0 24 24">'+a.i+'</svg></div><div><b>'+a.n+'</b><small>'+a.s+'</small>'+(LA[a.k]?"<em>সর্বশেষ খোলা: "+ago(LA[a.k])+"</em>":"")+'</div><span class="ar">›</span></a>'}).join("");
Array.prototype.forEach.call(document.querySelectorAll(".app"),function(e){e.addEventListener("click",function(){mark(e.getAttribute("data-k"))})});
var best=null;APPS.forEach(function(a){if(LA[a.k]&&(!best||LA[a.k]>LA[best.k]))best=a});
if(best){var r=$("res");r.style.display="flex";r.href=best.u;r.textContent="▶ চালিয়ে যান: "+best.n;r.onclick=function(){mark(best.k)}}
var nt=$("nt"),nto;nt.value=ls("div29-note")||"";
function cnt(){$("nc").textContent=bn(nt.value.length)+" অক্ষর"}cnt();
nt.oninput=function(){cnt();$("ns").textContent="লেখা হচ্ছে…";clearTimeout(nto);nto=setTimeout(function(){ls("div29-note",nt.value);$("ns").textContent="✓ সংরক্ষিত"},500)};
var dd=$("dd");dd.value=ls("div29-date")||"";
function dc(){if(!dd.value){$("dr").textContent="";return}ls("div29-date",dd.value);var a=dd.value.split("-"),t=new Date(+a[0],a[1]-1,+a[2]),n=new Date(),k=Math.round((t-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
$("dr").textContent=k==0?"আজই সেই দিন":k>0?bn(k)+" দিন বাকি":bn(-k)+" দিন আগে"}
dd.onchange=dc;dc();
var dp;addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;$("ins").style.display="block"});
$("ins").onclick=function(){if(dp){dp.prompt();dp=null;$("ins").style.display="none"}};
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
<script>
/* MOTIVATION টিকার: স্লোগান একটির পর একটি নিজে নিজে চলতে থাকে */
(function(){
var S=["ঘাম রক্ত বাঁচায়।","সমরে আমরা, শান্তিতে আমরা, সর্বত্র আমরা দেশের তরে।","শৃঙ্খলাই সৈনিকের শক্তি।","প্রশিক্ষণের ঘাম, যুদ্ধের রক্ত বাঁচায়।","সম্মান ও গৌরব — আমাদের অহংকার।"];
var t=document.getElementById("tkt");if(!t)return;var v=t.parentNode;
var slow=false;try{slow=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)}catch(e){}
var SPEED=slow?32:56,half=1,x=0,last=0,paused=false;
function unit(){var h="";for(var i=0;i<S.length;i++)h+='<span class="tk-s">'+S[i]+'</span><span class="tk-sep" aria-hidden="true"></span>';return h}
function build(){
 t.innerHTML=unit();
 var w=t.scrollWidth||1,vw=v.clientWidth||320,n=Math.max(1,Math.ceil(vw/w)),one="";
 for(var i=0;i<n;i++)one+=unit();
 t.innerHTML=one+one;
 half=(t.scrollWidth||2)/2;if(x>=half)x=x%half;
}
function frame(ts){
 if(!last)last=ts;var dt=Math.min(64,ts-last);last=ts;
 if(!paused){x+=SPEED*dt/1000;if(x>=half)x-=half;t.style.webkitTransform=t.style.transform="translate3d("+(-x).toFixed(2)+"px,0,0)"}
 requestAnimationFrame(frame)}
build();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(build);
var rt=0;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(build,200)});
document.addEventListener("visibilitychange",function(){last=0});
var tk=document.getElementById("tick");
function pz(on){return function(){paused=on}}
tk.addEventListener("touchstart",pz(true),{passive:true});tk.addEventListener("touchend",pz(false));tk.addEventListener("touchcancel",pz(false));
tk.addEventListener("mousedown",pz(true));tk.addEventListener("mouseup",pz(false));tk.addEventListener("mouseleave",pz(false));
requestAnimationFrame(frame);
})();
</script>
